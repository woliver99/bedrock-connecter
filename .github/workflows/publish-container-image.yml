name: Publish Container Image & Pterodactyl Egg Release

# Allows running manually from the Actions tab with a toggle to mark as latest
on:
  workflow_dispatch:
    inputs:
      mark_as_latest:
        description: 'Mark this build as "latest" (tags ghcr.io/...:latest and sets latest GitHub Release)'
        type: boolean
        required: true
        default: true
      version_tag:
        description: 'Optional custom version tag (e.g., v1.0.0). Leave empty to use v<run_number>.'
        type: string
        required: false
        default: ''

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # Permissions required to publish to GHCR and create GitHub Releases with assets
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version_tag }}" ]; then
            TAG="${{ inputs.version_tag }}"
          else
            TAG="v${{ github.run_number }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Using version tag: ${TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ inputs.mark_as_latest }}
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release with Pterodactyl Egg
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            ## BedrockConnect + MCXboxBroadcast Release `${{ steps.version.outputs.tag }}`
            
            ### Pterodactyl / Pelican Egg Asset
            Download or auto-update using `egg-bedrockconnect-xboxbroadcast.json` below.
            
            ### Container Image
            - `ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}`
            ${{ inputs.mark_as_latest && format('- `ghcr.io/{0}:latest`', github.repository) || '' }}
          files: egg-bedrockconnect-xboxbroadcast.json
          make_latest: ${{ inputs.mark_as_latest }}
